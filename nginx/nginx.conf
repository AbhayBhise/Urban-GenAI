# ==============================================================================
# High-Throughput Production Nginx Reverse Proxy Configuration
# Engineered to handle massive concurrent traffic, microcaching, and security
# ==============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens   off;

    # Client payload size clamping (matches backend MAX_UPLOAD_MB=8)
    client_max_body_size 8M;
    client_body_buffer_size 128k;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Edge Rate Limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=inference_limit:20m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # Upstream backend pool with connection keepalive
    upstream urbangen_backend {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Microcache zone for idempotent GET queries
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:20m max_size=500m inactive=60m use_temp_path=off;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # OWASP Security Headers at Edge Proxy
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend Static Single Page Application (SPA)
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Aggressive caching for hashed assets
            location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }

        # Health & Prometheus Telemetry Probes (Bypass rate limiter & cache)
        location ~ ^/(healthz|readyz|metrics)$ {
            proxy_pass http://urbangen_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # Heavy ML Inference Endpoints (Protected by dedicated rate limiter)
        location ~ ^/infer/ {
            limit_req zone=inference_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://urbangen_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for neural style transfer and diffusion sampling
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # General API Endpoints with Microcaching on GET
        location ~ ^/(status|config|evaluate/|datasets|system|privacy|governance/|sample/|transformer/stats) {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://urbangen_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Microcache idempotent GET requests
            proxy_cache api_cache;
            proxy_cache_valid 200 302 60s;
            proxy_cache_valid 404 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Proxy-Cache $upstream_cache_status;
        }

        # Catch-all API Proxy
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://urbangen_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
